<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Command</title>

    <style>
        body {
            margin: 0;
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px 25px;
            background: #101722;
            border-bottom: 1px solid #293241;
            display: flex;
            justify-content: space-between;
        }

        h1 {
            margin: 0;
            color: #42d9ff;
        }

        .live {
            color: #20df8a;
            font-weight: bold;
        }

        .container {
            max-width: 1500px;
            margin: auto;
            padding: 15px;
        }

        .chart {
            height: 650px;
            background: #101722;
            border-radius: 12px;
            overflow: hidden;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .card {
            background: #101722;
            border: 1px solid #293241;
            border-radius: 12px;
            padding: 20px;
        }

        .label {
            color: #8793a5;
            font-size: 13px;
            text-transform: uppercase;
        }

        .value {
            margin-top: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        .cyan {
            color: #42d9ff;
        }

        .green {
            color: #20df8a;
        }

        .yellow {
            color: #ffd166;
        }

        .gray {
            color: #9aa6b8;
        }

        .info {
            margin-top: 15px;
            padding: 18px;
            background: #101722;
            border: 1px solid #293241;
            border-radius: 12px;
            color: #9aa6b8;
        }

        @media(max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SMC COMMAND</h1>
    <div class="live">● LIVE CHART</div>
</header>

<div class="container">

    <div class="chart" id="tradingview"></div>

    <div class="grid">

        <div class="card">
            <div class="label">Market Structure</div>
            <div class="value yellow">WAITING</div>
        </div>

        <div class="card">
            <div class="label">Analysis</div>
            <div class="value cyan">WAITING</div>
        </div>

        <div class="card">
            <div class="label">Order Block</div>
            <div class="value gray">WAITING</div>
        </div>

        <div class="card">
            <div class="label">Fair Value Gap</div>
            <div class="value gray">WAITING</div>
        </div>

    </div>

    <div class="grid">

        <div class="card">
            <div class="label">Market Data</div>
            <div class="value green" id="dataStatus">
                NOT CONNECTED
            </div>
        </div>

        <div class="card">
            <div class="label">Engine</div>
            <div class="value cyan">
                READY
            </div>
        </div>

        <div class="card">
            <div class="label">Last Update</div>
            <div class="value gray" id="clock">
                --
            </div>
        </div>

        <div class="card">
            <div class="label">Symbol</div>
            <div class="value cyan">
                XAUUSD
            </div>
        </div>

    </div>

    <div class="info">
        <strong>SMC Command</strong><br><br>
        Live chart: connected through TradingView.<br>
        Analysis engine: waiting for a separate market-data feed.
    </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

new TradingView.widget({

    width: "100%",
    height: 650,

    symbol: "OANDA:XAUUSD",

    interval: "15",

    timezone: "Asia/Kolkata",

    theme: "dark",

    style: "1",

    locale: "en",

    enable_publishing: false,

    hide_top_toolbar: false,

    hide_legend: false,

    save_image: false,

    container_id: "tradingview"

});


function updateClock() {

    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString();

}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
